<div class="gc-field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.errors %}<ul class="gc-errors">{% for e in field.errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
  {% if field.help_text and show_help %}<div class="gc-help">{{ field.help_text|safe }}</div>{% endif %}
</div>
