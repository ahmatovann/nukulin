{% extends 'base.html' %}
{% block title %}Пароль изменён{% endblock %}
{% block content %}
<section class="gc-card gc-auth gc-flow gc-flow--center" data-flow>
  <div class="gc-flow-cover" aria-hidden="true"></div>
  <div class="gc-flow-step">
    <div class="gc-orb gc-orb--in gc-orb--success" aria-hidden="true">
      <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path class="gc-draw" d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h1 class="gc-flow-title">Пароль изменён</h1>
    <p class="muted">Готово! Теперь войдите с новым паролем.</p>
    <a class="gc-btn gc-btn--block" href="{% url 'accounts:login' %}">Войти</a>
  </div>
</section>
{% endblock %}
